# Drop this into a repo to run the cross-repo review sweep on a schedule.
# Store ANTHROPIC_API_KEY and a REVIEW_GITHUB_TOKEN (a PAT that can see all the
# repos you want covered) as repository/organization secrets.
name: Claude review sweep

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes
  workflow_dispatch: {}       # allow manual runs

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install tools
        run: |
          sudo apt-get update && sudo apt-get install -y jq
          npm install -g @anthropic-ai/claude-code   # provides the `claude` CLI
      - name: Run review sweep
        env:
          # A PAT, not the default GITHUB_TOKEN: the built-in token only sees
          # this repo, but the sweep is meant to span all your repos.
          GITHUB_TOKEN: ${{ secrets.REVIEW_GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: ./review-all-repos.sh
